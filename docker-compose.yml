# Runs the whole application (API + UI) with one command:  docker compose up --build -d
services:
  superkart-backend:
    build: ./backend_files
    container_name: superkart-backend
    ports:
      - "7860:7860"
    restart: unless-stopped

  superkart-frontend:
    build: ./frontend_files
    container_name: superkart-frontend
    environment:
      - BACKEND_URL=http://superkart-backend:7860   # the backend is reachable by its service name
    ports:
      - "8501:8501"
    depends_on:
      - superkart-backend
    restart: unless-stopped
